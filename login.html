<!DOCTYPE html>
<html class="scrollbar-none overflow-scroll" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Login - Pin</title>
  </head>
  <body class="" id="login">
    <div>
      <main
        class="min-h-screen bg-cover bg-black/70 bg-blend-overlay bg-no-repeat bg-[40%] lg:bg-top w-full bg-[url('./images/auth-bg.png')]"
      >
        <section class="w-full px-5 lg:pb-5 container mx-auto">
          <div
            class="flex relative flex-row justify-center min-h-screen w-full pb-5 md:justify-between"
          >
            <!-- Right Sided Form -->
            <div
              class="md:flex-col gap-2 fixed bottom-[20px] left-[80px] hidden md:flex mt-auto max-w-xs lg:max-w-sm text-white"
            >
              <h2 class="text-lg md:text-2xl lg:text-3xl font-bold">
                Trust and security are at the heart of BillPoint
              </h2>
              <p>
                Pay your electricity, internet, and other utility bills quickly
                and easily from the palm of your hand.
              </p>
            </div>

            <!-- Left Sided Form -->
            <div
              class=" self-end w-full md:ml-auto md:self-end md:w-[35%] p-3 bg-white  rounded-2xl"
            >
              <div
                class="login md:flex bg-white flex-col rounded-2xl w-full p-3 md:p-8 xl:p-5 max-h-[35vh] lg:max-h-[55vh] overflow-y-auto scrollbar"
              >
                <div class="">
                  <a
                    href="./index.html"
                    class="w-8 h-8 mb-3 flex justify-center items-center border rounded-lg border-black text-black"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="18"
                      height="18"
                      viewBox="0 0 18 18"
                      fill="none"
                      class="w-6 h-6 icon mx-auto"
                    >
                      <path
                        d="M10.6996 14.2096L6.04867 9.55867C5.4994 9.0094 5.4994 8.1106 6.04867 7.56133L10.6996 2.9104"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-miterlimit="10"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path>
                    </svg>
                  </a>
                  <h1 class="text-2xl font-bold">OTP Verification</h1>

                  <p class="text-black text-sm py-1">
                    Create an account so you can pay your bills and purchase
                    top-ups faster.
                  </p>
                  <p class="text-black font-semibold mt-1 text-sm">
                    toluatnewlife@gmail.com
                  </p>
                </div>

                <form action="./dashboard.html" id="login-pin-form" class="">
                  <div class="mt-0 w-full ">
                    <div class="mt-9 w-auto grid grid-cols-6 md:gap-3  xl:gap-6">
                      <input
                        type="tel"
                        class="flex items-center justify-center outline-none border caret-transparent text-xl md:text-3xl font-bold border-black w-9 h-9 md:w-14 md:h-14 rounded-xl text-black text-center otp-login-input"
                        required
                        maxlength="1"
                        inputmode="numeric"
                        autocomplete="off"
                      />
                      <input
                        type="tel"
                        class="flex items-center justify-center outline-none border caret-transparent text-xl md:text-3xl font-bold border-black w-9 h-9 md:w-14 md:h-14 rounded-xl text-black text-center otp-login-input"
                        required
                        maxlength="1"
                        inputmode="numeric"
                        autocomplete="off"
                      />
                      <input
                        type="tel"
                        class="flex items-center justify-center outline-none border caret-transparent text-xl md:text-3xl font-bold border-black w-9 h-9 md:w-14 md:h-14 rounded-xl text-black text-center otp-login-input"
                        required
                        maxlength="1"
                        inputmode="numeric"
                        autocomplete="off"
                      />
                      <input
                        type="tel"
                        class="flex items-center justify-center outline-none border caret-transparent text-xl md:text-3xl font-bold border-black w-9 h-9 md:w-14 md:h-14 rounded-xl text-black text-center otp-login-input"
                        required
                        maxlength="1"
                        inputmode="numeric"
                        autocomplete="off"
                      />
                      <input
                        type="tel"
                        class="flex items-center justify-center outline-none border caret-transparent text-xl md:text-3xl font-bold border-black w-9 h-9 md:w-14 md:h-14 rounded-xl text-black text-center otp-login-input"
                        required
                        maxlength="1"
                        inputmode="numeric"
                        autocomplete="off"
                      />
                      <input
                        type="tel"
                        class="flex items-center justify-center outline-none border caret-transparent text-xl md:text-3xl font-bold border-black w-9 h-9 md:w-14 md:h-14 rounded-xl text-black text-center otp-login-input"
                        required
                        maxlength="1"
                        inputmode="numeric"
                        autocomplete="off"
                      />
                    </div>
                    <div class="w-full mt-3">
                      <div class="mb-12">
                        <button
                          type="submit"
                          class="flex w-full items-center justify-center text-primary underline"
                        >
                          Reset code
                        </button>

                        <!-- <p class=" text-center text-gray-500">Code sent. Resend code in 1:50</p> -->
                      </div>
                      <button
                        type="submit"
                        class="block w-full capitalize rounded-xl bg-primary px-5 py-3 text-sm font-medium text-white"
                      >
                        Continue
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./js/auth.js"></script>
  </body>
</html>
