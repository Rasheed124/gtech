<div class="space-y-4">
  <!-- Phone Number -->
  <div class="mt-5">
    <label
      for="selectDataPlan"
      class="block text-sm mb-1 font-medium text-gray-900 dark:text-white"
    >
      Phone Number
    </label>
    <input
      type="number"
      id="number"
      class="peer w-full border border-gray-300 dark:border-gray-600 form-input !bg-transparent py-3"
    />
  </div>

  <!-- Select Data Plan -->
  <div class="relative w-full" x-data="{ open: false, selected: '' }">
    <label
      for="selectDataPlan"
      class="block text-sm font-medium text-gray-900 dark:text-white"
    >
      Select Data Plan
    </label>
    <div
      @click="open = !open"
      class="mt-1.5 w-full rounded-lg border !bg-transparent py-3 bg-white dark:bg-gray-900 border-gray-300 p-2 cursor-pointer flex justify-between items-center sm:text-sm dark:border-gray-600"
    >
      <span
        x-text="selected || 'Please select'"
        class="text-gray-700 dark:text-gray-300"
        >Please select</span
      >
      <svg
        class="w-5 h-5 text-gray-500 dark:text-gray-400 rotate-0"
        :class="open ? 'rotate-180' : 'rotate-0'"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 011.06 1.06l-4 4a.75.75 0 01-1.06 0l-4-4a.75.75 0 01.02-1.06z"
          clip-rule="evenodd"
        ></path>
      </svg>
    </div>

    <!-- Dropdown Options -->
    <div
      x-show="open"
      @click.away="open = false"
      class="absolute z-10 mt-2 w-full bg-gray-100 border border-gray-300 rounded-lg shadow-lg overflow-hidden dark:bg-gray-900 dark:border-gray-600"
      x-transition=""
      style="display: none"
    >
      <ul class="max-h-40 m-2 overflow-y-auto scrollbar-none">
        <li
          @click="selected = 'John Mayer'; open = false"
          class="px-4 py-2 hover:bg-gray-200 rounded-lg dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
        >
          John Mayer
        </li>
        <li
          @click="selected = 'Stevie Ray Vaughn'; open = false"
          class="px-4 py-2 hover:bg-gray-200 rounded-lg dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
        >
          Stevie Ray Vaughn
        </li>
        <li
          @click="selected = 'Jimi Hendrix'; open = false"
          class="px-4 py-2 hover:bg-gray-200 rounded-lg dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
        >
          Jimi Hendrix
        </li>
        <li
          @click="selected = 'B.B King'; open = false"
          class="px-4 py-2 hover:bg-gray-200 rounded-lg dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
        >
          B.B King
        </li>
        <li
          @click="selected = 'Albert King'; open = false"
          class="px-4 py-2 hover:bg-gray-200 rounded-lg dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
        >
          Albert King
        </li>
        <li
          @click="selected = 'Buddy Guy'; open = false"
          class="px-4 py-2 hover:bg-gray-200 rounded-lg dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
        >
          Buddy Guy
        </li>
        <li
          @click="selected = 'Eric Clapton'; open = false"
          class="px-4 py-2 hover:bg-gray-200 rounded-lg dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
        >
          Eric Clapton
        </li>
      </ul>
    </div>
  </div>

  <!-- Select Search -->
  <div
    class="relative w-full"
    x-data="{ 
     open: false, 
     selected: '', 
     search: '', 
     options: ['John Mayer', 'Stevie Ray Vaughn', 'Jimi Hendrix', 'B.B King', 'Albert King', 'Buddy Guy', 'Eric Clapton'] 
   }"
  >
    <label
      for="selectDataPlan"
      class="block text-sm font-medium text-gray-900 dark:text-white"
    >
      Select Data Plan
    </label>

    <!-- Selected Option Display -->
    <div
      @click="open = !open"
      class="mt-1.5 w-full rounded-lg border !bg-transparent py-3 bg-white dark:bg-gray-900 border-gray-300 p-2 cursor-pointer flex justify-between items-center sm:text-sm dark:border-gray-600"
    >
      <span
        x-text="selected || 'Please select'"
        class="text-gray-700 dark:text-gray-300"
        >Please select</span
      >
      <svg
        class="w-5 h-5 text-gray-500 dark:text-gray-400 rotate-0"
        :class="open ? 'rotate-180' : 'rotate-0'"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 011.06 1.06l-4 4a.75.75 0 01-1.06 0l-4-4a.75.75 0 01.02-1.06z"
          clip-rule="evenodd"
        ></path>
      </svg>
    </div>

    <!-- Dropdown Options -->
    <div
      x-show="open"
      @click.away="open = false"
      class="absolute z-10 mt-2 w-full bg-gray-100 border border-gray-300 rounded-lg shadow-lg overflow-hidden dark:bg-gray-900 dark:border-gray-600"
      x-transition=""
      style="display: none"
    >
      <!-- Search Input -->
      <div class="p-2">
        <input
          type="text"
          class="w-full px-3 py-2 form-input !bg-transparent"
          placeholder="Search..."
          x-model="search"
        />
      </div>

      <ul class="max-h-40 overflow-y-auto scrollbar-none">
        <template
          x-for="option in options.filter(o => o.toLowerCase().includes(search.toLowerCase()))"
          :key="option"
        >
          <li
            @click="selected = option; open = false; search = ''"
            class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
            x-text="option"
          ></li>
        </template>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        >
          John Mayer
        </li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        >
          Stevie Ray Vaughn
        </li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        >
          Jimi Hendrix
        </li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        >
          B.B King
        </li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        >
          Albert King
        </li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        >
          Buddy Guy
        </li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        >
          Eric Clapton
        </li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        ></li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        ></li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        ></li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        ></li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        ></li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        ></li>
        <li
          @click="selected = option; open = false; search = ''"
          class="px-4 py-2 m-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-gray-700 dark:text-gray-300"
          x-text="option"
        ></li>

        <!-- No Results Message -->
        <li
          x-show="options.filter(o => o.toLowerCase().includes(search.toLowerCase())).length === 0"
          class="px-4 py-2 text-gray-500 dark:text-gray-400"
          style="display: none"
        >
          No results found
        </li>
      </ul>
    </div>
  </div>

  <!-- Fee -->
  <div>
    <label
      class="block text-sm font-medium mb-1 text-gray-900 dark:text-white"
      for="fee "
      >Fee</label
    >
    <div class="relative">
      <input
        id="prefix"
        class="border border-gray-300 dark:border-gray-600 form-input w-full pl-6 py-3 !bg-transparent"
        type="text"
      />
      <div
        class="absolute inset-0 right-auto flex items-center pointer-events-none"
      >
        <span class="text-sm text-gray-400 dark:text-gray-500 font-bold px-3"
          >₦</span
        >
      </div>
    </div>
  </div>
  <!-- Pin -->
  <div>
    <div class="relative">
      <label
        class="block text-sm font-medium mb-1 text-gray-900 dark:text-white"
        for="fee "
        >Enter Pin</label
      >
      <input
        id="pin"
        class="border border-gray-300 dark:border-gray-600 form-input !bg-transparent w-full pl-6 py-3"
        type="password"
      />
    </div>
  </div>

  <div class="mt-1.5">
    <!-- Start -->
    <button
      class="py-3 rounded-lg bg-primary px-5 text-gray-100 hover:bg-primary/70 dark:bg-primary dark:text-white"
    >
      Submit
    </button>
    <!-- End -->
  </div>
</div>
