<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./output.css" />
    <title>Signup</title>
  </head>
  <body>
    <div>
      <main
        class="min-h-screen bg-cover bg-black/50 bg-blend-overlay bg-no-repeat bg-[40%] lg:bg-top w-full bg-[url('./images/auth-signup-bg.png')] flex h-screen overflow-y-auto md:px-2"
      >
      <section class="w-full container mx-auto">
          <div
            class="md:flex grid md:gap-5 items-center h-full mt-auto md:mt-0 md:my-auto md:py-20 md:px-10 lg:px-0 pb-5"
          >
            <!-- Right Sided Form -->
            <div
              class="md:flex-col gap-2 hidden md:flex mt-auto max-w-xs lg:max-w-md text-white"
            >
              <h2 class="text-lg md:text-2xl lg:text-3xl font-bold">
                Trust and security are at the heart of BillPoint
              </h2>

              <p>
                Pay your electricity, internetn, and other utility bills quickly
                and easily from the palm of your hand.
              </p>
            </div>

            <!-- Left Sided Form -->
            <div
              class="md:flex bg-white w-[90%] md:w-full mx-auto md:mx-0 md:max-w-[480px] rounded-3xl p-4 py-8 md:p-10 flex flex-col gap-4 md:ml-auto pt-10 md:py-10 pb-8 mt-auto"
            >
              <div class="">
                <a
                  href="./index.html"
                  class="w-8 h-8 mb-3 flex justify-center items-center border rounded-lg border-[#828282] text-[#828282]"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 18 18"
                    fill="none"
                    class="w-6 h-6 icon mx-auto"
                  >
                    <path
                      d="M10.6996 14.2096L6.04867 9.55867C5.4994 9.0094 5.4994 8.1106 6.04867 7.56133L10.6996 2.9104"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-miterlimit="10"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                  </svg>
                </a>
                <h1 class="text-2xl font-bold mb-1">Getting started</h1>

                <p class="text-gray-500 text-sm">
                  Create an account so you can pay your bills and purchase
                  top-ups faster.
                </p>

                <form action="" class="lg:px-4">
                  <div class="mt-0">
                    <div class="w-full">
                      <div class="space-y-3 py-10">
                        <div>
                          <label for="fullName" class="sr-only"
                            >Full Name</label
                          >

                          <div class="relative">
                            <input
                              type="text"
                              class="w-full outline-none focus:border focus:border-deep-purple focus:transition-colors focus:duration-700 rounded-lg border-gray-200 bg-gray-100 p-4 pe-8 text-sm shadow-sm"
                              placeholder="Full Name"
                            />
                          </div>
                        </div>
                        <div>
                          <label for="email" class="sr-only"
                            >Email Address</label
                          >

                          <div class="relative">
                            <input
                              type="email"
                              class="w-full outline-none focus:border focus:border-deep-purple focus:transition-colors focus:duration-700 rounded-lg border-gray-200 bg-gray-100 p-4 pe-8 text-sm shadow-sm"
                              placeholder="Email Address"
                            />
                          </div>
                        </div>
                        <div>
                          <label for="email" class="sr-only"
                            >Whatsapp number</label
                          >

                          <div class="relative">
                            <input
                              type="text"
                              class="w-full outline-none focus:border focus:border-deep-purple focus:transition-colors focus:duration-700 rounded-lg border-gray-200 bg-gray-100 p-4 pe-8 text-sm shadow-sm"
                              placeholder="Whatsapp number"
                            />
                          </div>
                        </div>
                        <div>
                          <label for="password" class="sr-only">Password</label>

                          <div class="relative">
                            <input
                              type="password"
                              class="w-full outline-none focus:border focus:border-deep-purple focus:transition-colors focus:duration-700 rounded-lg border-gray-200 bg-gray-100 p-4 pe-8 text-sm shadow-sm"
                              placeholder="Password"
                            />

                            <button
                              class="absolute inset-y-0 end-0 grid place-content-center px-4"
                            >
                              <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                class="w-6 h-6"
                              >
                                <path
                                  d="M15.5799 12C15.5799 13.98 13.9799 15.58 11.9999 15.58C10.0199 15.58 8.41992 13.98 8.41992 12C8.41992 10.02 10.0199 8.41998 11.9999 8.41998C13.9799 8.41998 15.5799 10.02 15.5799 12Z"
                                  stroke="#333"
                                  stroke-width="1.5"
                                  stroke-linecap="round"
                                  stroke-linejoin="round"
                                ></path>
                                <path
                                  d="M11.9998 20.27C15.5298 20.27 18.8198 18.19 21.1098 14.59C22.0098 13.18 22.0098 10.81 21.1098 9.39997C18.8198 5.79997 15.5298 3.71997 11.9998 3.71997C8.46984 3.71997 5.17984 5.79997 2.88984 9.39997C1.98984 10.81 1.98984 13.18 2.88984 14.59C5.17984 18.19 8.46984 20.27 11.9998 20.27Z"
                                  stroke="#333"
                                  stroke-width="1.5"
                                  stroke-linecap="round"
                                  stroke-linejoin="round"
                                ></path>
                              </svg>
                            </button>
                          </div>
                        </div>
                        <div>
                          <label for="confirmPassword" class="sr-only"
                            >Confirm Password</label
                          >

                          <div class="relative">
                            <input
                              type="password"
                              class="w-full outline-none focus:border focus:border-deep-purple focus:transition-colors focus:duration-700 rounded-lg border-gray-200 bg-gray-100 p-4 pe-8 text-sm shadow-sm"
                              placeholder="Confirm Password"
                            />

                            <button
                              class="absolute inset-y-0 end-0 grid place-content-center px-4"
                            >
                              <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                class="w-6 h-6"
                              >
                                <path
                                  d="M15.5799 12C15.5799 13.98 13.9799 15.58 11.9999 15.58C10.0199 15.58 8.41992 13.98 8.41992 12C8.41992 10.02 10.0199 8.41998 11.9999 8.41998C13.9799 8.41998 15.5799 10.02 15.5799 12Z"
                                  stroke="#333"
                                  stroke-width="1.5"
                                  stroke-linecap="round"
                                  stroke-linejoin="round"
                                ></path>
                                <path
                                  d="M11.9998 20.27C15.5298 20.27 18.8198 18.19 21.1098 14.59C22.0098 13.18 22.0098 10.81 21.1098 9.39997C18.8198 5.79997 15.5298 3.71997 11.9998 3.71997C8.46984 3.71997 5.17984 5.79997 2.88984 9.39997C1.98984 10.81 1.98984 13.18 2.88984 14.59C5.17984 18.19 8.46984 20.27 11.9998 20.27Z"
                                  stroke="#333"
                                  stroke-width="1.5"
                                  stroke-linecap="round"
                                  stroke-linejoin="round"
                                ></path>
                              </svg>
                            </button>
                          </div>
                        </div>
                      </div>

                      <button
                        type="submit"
                        class="block w-full capitalize rounded-xl bg-deep-purple px-5 py-3 text-sm font-medium text-white"
                      >
                        Continue
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
